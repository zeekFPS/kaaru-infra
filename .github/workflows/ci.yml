name: infra-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: fmt et validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/prod
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format
        run: terraform fmt -check -recursive ../..

      # Pas de credentials : on initialise sans backend et on valide la
      # configuration. Un plan reel demanderait un abonnement Azure, ce que la
      # CI publique ne doit pas contenir.
      - name: Init sans backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate
